name: PR maintenance verified repairs

on:
  push:
    branches:
      - repair/pr-maintenance-20260929
    paths:
      - .github/workflows/pr-maintenance-validation.yml

permissions:
  contents: write

jobs:
  repair:
    name: Verify PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '10251'
            head: 478a913d184bc60183de320117908ae998cbfbd0
            branch: fix/10239-publish-assets-self-guard
            patch: 026bee18ca60e65f092124d2955039f405c3bc44
          - pr: '10280'
            head: d904473895e59e4e52559c77d92f03cd04c498e6
            branch: fix/10170-esc-cancel-stop
            patch: 4acaeda1f1822ef135443a87d4c6c08d00167951
    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: '1'
      TERM: dumb
      EXPECTED_HEAD: ${{ matrix.head }}
      HEAD_BRANCH: ${{ matrix.branch }}
      PR_NUMBER: ${{ matrix.pr }}
      PATCH_BLOB: ${{ matrix.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge current upstream into an isolated candidate
        run: python3 control/_maintenance/verify.py prepare
      - name: Install pinned dependencies and build workspaces
        run: python3 control/_maintenance/verify.py install
      - name: Reproduce the reported defect before the fix
        run: python3 control/_maintenance/verify.py red
      - name: Apply and format the implementation repair
        run: python3 control/_maintenance/verify.py fix
      - name: Build and type-check
        run: python3 control/_maintenance/verify.py build
      - name: Run regression suites and lint
        run: python3 control/_maintenance/verify.py green
      - name: Publish the verified candidate without changing the original PR
        run: python3 control/_maintenance/verify.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-repair-${{ matrix.pr }}
          path: ${{ runner.temp }}/repair-result/
          retention-days: 1
