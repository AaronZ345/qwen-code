name: PR maintenance validation

on:
  push:
    branches:
      - repair/pr-maintenance-20260929

permissions:
  contents: read

concurrency:
  group: pr-maintenance-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record baseline and export source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr-maintenance"
          git rev-parse HEAD > "$RUNNER_TEMP/pr-maintenance/commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr-maintenance/source.tar.gz"
          gh repo view --help > "$RUNNER_TEMP/pr-maintenance/gh-repo-view-help.txt"
      - name: Install pinned dependencies and build workspaces
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Run asset publishing regression suite
        shell: bash
        working-directory: packages/cli
        env:
          NO_COLOR: '1'
          TERM: dumb
        run: |
          set -euo pipefail
          npx --no-install vitest run src/commands/review/publish-assets.test.ts --maxWorkers 2 2>&1 | tee "$RUNNER_TEMP/pr-maintenance/publish-assets-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-maintenance-validation
          path: ${{ runner.temp }}/pr-maintenance/
          retention-days: 1
