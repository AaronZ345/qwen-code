name: PR maintenance verified repairs

on:
  push:
    branches:
      - repair/pr-maintenance-20260929
    paths:
      - .github/workflows/pr-maintenance-validation.yml

permissions:
  contents: write

jobs:
  repair:
    name: Verify PR 10279
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: '1'
      TERM: dumb
      EXPECTED_HEAD: adce346cad83ac768a1cbafded225b1d4ce98a70
      HEAD_BRANCH: fix/10276-dws-error-detail
      PR_NUMBER: '10279'
      PATCH_BLOB: 4dfc29efa05465a23816b765d7c9ed4ecd2329f6
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and check out the exact current PR head
        run: python3 control/_maintenance/verify_current.py prepare
      - name: Install pinned dependencies and build workspaces
        run: python3 control/_maintenance/verify.py install
      - name: Reproduce the reported defect before the fix
        run: python3 control/_maintenance/verify.py red
      - name: Apply and format the implementation repair
        run: python3 control/_maintenance/verify.py fix
      - name: Build the affected package
        run: python3 control/_maintenance/verify.py build
      - name: Run regression suites and lint
        run: python3 control/_maintenance/verify.py green
      - name: Export verified files and publish the isolated candidate
        run: python3 control/_maintenance/verify_current.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-repair-10279
          path: ${{ runner.temp }}/repair-result/
          retention-days: 1
