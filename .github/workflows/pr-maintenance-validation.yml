name: PR maintenance verified repairs

on:
  push:
    branches:
      - repair/pr-maintenance-20260929
    paths:
      - .github/workflows/pr-maintenance-validation.yml

permissions:
  contents: write

jobs:
  repair:
    name: Verify PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '10279'
            head: adce346cad83ac768a1cbafded225b1d4ce98a70
            branch: fix/10276-dws-error-detail
            patch: 4dfc29efa05465a23816b765d7c9ed4ecd2329f6
          - pr: '9921'
            head: 8d537a5bb68c3e48fb4ceee9f848a8f195cc583a
            branch: fix-ask-question-cancel-reason
            patch: 51a1d5fa0e1a8cadab387b3705af96951f9bfb54
          - pr: '9541'
            head: 25a79e30d27a94050465b4bee8533913cacbbb82
            branch: aaron/fix-compression-context-admission
            patch: generated-after-verified-merge
    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: '1'
      TERM: dumb
      EXPECTED_HEAD: ${{ matrix.head }}
      HEAD_BRANCH: ${{ matrix.branch }}
      PR_NUMBER: ${{ matrix.pr }}
      PATCH_BLOB: ${{ matrix.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the scoped validation specifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          p = pathlib.Path('control/_maintenance/specs.json')
          data = json.loads(p.read_text())
          data.update(json.loads(pathlib.Path('control/_maintenance/spec-9541.json').read_text()))
          spec = data['9921']
          path = 'packages/cli/src/acp-integration/session/Session.test.ts'
          spec['files'].append(path)
          spec['format_files'].append(path)
          spec['additional_patches'] = ['9921-session-expected.patch']
          p.write_text(json.dumps(data, indent=2))
          PY
      - name: Verify and check out the exact current PR head
        if: matrix.pr != '9541'
        run: python3 control/_maintenance/verify_current.py prepare
      - name: Merge current upstream and prepare the compression regression
        if: matrix.pr == '9541'
        run: python3 control/_maintenance/prepare_compression.py
      - name: Remove only the named unrelated PR hunks
        run: python3 control/_maintenance/complete.py rollback
      - name: Install pinned dependencies and build workspaces
        run: python3 control/_maintenance/verify.py install
      - name: Reproduce the reported defect before the fix
        run: python3 control/_maintenance/verify.py red
      - name: Apply and format the implementation repair
        run: python3 control/_maintenance/complete.py fix
      - name: Finish the DWS import and regular-expression cleanup
        if: matrix.pr == '10279'
        shell: bash
        run: |
          set -euo pipefail
          for patch in 10279-unused-import.patch 10279-regex-lint.patch; do
            git -C candidate apply --check "$GITHUB_WORKSPACE/control/_maintenance/patches/$patch"
            git -C candidate apply "$GITHUB_WORKSPACE/control/_maintenance/patches/$patch"
          done
          git -C candidate diff --binary > "$RUNNER_TEMP/repair-result/fix.patch"
      - name: Build and type-check the affected package
        run: python3 control/_maintenance/verify.py build
      - name: Run regression suites and lint
        run: python3 control/_maintenance/verify.py green
      - name: Export verified files and publish the isolated candidate
        run: python3 control/_maintenance/verify_current.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-repair-${{ matrix.pr }}
          path: ${{ runner.temp }}/repair-result/
          retention-days: 1
