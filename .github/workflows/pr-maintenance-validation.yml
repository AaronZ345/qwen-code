name: PR maintenance source snapshots

on:
  push:
    branches:
      - repair/pr-maintenance-20260929

permissions:
  contents: read

concurrency:
  group: pr-maintenance-snapshots-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect exact upstream and PR snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr-snapshots'
          out.mkdir()
          targets = {
              'QwenLM/qwen-code': [9541, 9921, 10251, 10280, 10279],
              'chenhg5/cc-connect': [1817, 1801, 1816, 1800, 1886],
              'agentscope-ai/QwenPaw': [6874],
              'volcengine/OpenViking': [3504, 4396],
          }
          manifest = {}
          for repo, numbers in targets.items():
              destination = out / repo.replace('/', '__')
              destination.mkdir()
              work = pathlib.Path(tempfile.mkdtemp(prefix='pr-source-'))
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(work), *args], text=True).strip()
              def api(path, paginated=False):
                  args = ['gh', 'api', path]
                  if paginated:
                      args += ['--paginate', '--slurp']
                  return json.loads(subprocess.check_output(args, text=True))
              git('init', '--quiet')
              git('remote', 'add', 'upstream', 'https://github.com/' + repo + '.git')
              metadata = api('repos/' + repo)
              git('fetch', '--quiet', '--no-tags', '--depth=1', 'upstream', metadata['default_branch'])
              base = git('rev-parse', 'FETCH_HEAD')
              with (destination / 'upstream.tar.gz').open('wb') as stream:
                  subprocess.run(['git', '-C', str(work), 'archive', '--format=tar.gz', base], stdout=stream, check=True)
              state = {'upstream_sha': base, 'default_branch': metadata['default_branch'], 'prs': {}}
              for number in numbers:
                  pr = api(f'repos/{repo}/pulls/{number}')
                  prefix = destination / str(number)
                  prefix.mkdir()
                  (prefix / 'pr.json').write_text(json.dumps(pr, indent=2))
                  sha = pr['head']['sha']
                  git('fetch', '--quiet', '--no-tags', '--depth=1', 'upstream', f'refs/pull/{number}/head')
                  if git('rev-parse', 'FETCH_HEAD') != sha:
                      raise RuntimeError(f'{repo}#{number} changed during snapshot; refusing a mixed snapshot')
                  with (prefix / 'from-upstream.patch').open('wb') as stream:
                      subprocess.run(['git', '-C', str(work), 'diff', '--binary', base, sha], stdout=stream, check=True)
                  for label, path in {
                      'reviews': f'repos/{repo}/pulls/{number}/reviews',
                      'review-comments': f'repos/{repo}/pulls/{number}/comments',
                      'conversation': f'repos/{repo}/issues/{number}/comments',
                      'files': f'repos/{repo}/pulls/{number}/files',
                      'commits': f'repos/{repo}/pulls/{number}/commits',
                  }.items():
                      (prefix / (label + '.json')).write_text(json.dumps(api(path, True), indent=2))
                  state['prs'][str(number)] = {
                      'head_sha': sha,
                      'head_repo': pr['head']['repo']['full_name'],
                      'head_ref': pr['head']['ref'],
                      'state': pr['state'],
                      'updated_at': pr['updated_at'],
                  }
                  print(f'{repo}#{number}: {sha}', flush=True)
              manifest[repo] = state
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-source-snapshots
          path: ${{ runner.temp }}/pr-snapshots/
          retention-days: 1
          compression-level: 1
